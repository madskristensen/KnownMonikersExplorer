# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Build"
permissions:
  actions: write
  contents: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.vsix_version.outputs.version-number }}
    name: Build
    runs-on: windows-latest
    env:
      Configuration: Release
      DeployExtension: False
      Solution: KnownMonikersExplorer.slnx
      TestProject: tests\KnownMonikersExplorer.Tests\KnownMonikersExplorer.Tests.csproj
      TestResultsDirectory: ${{ github.workspace }}\TestResults
      VsixManifestPath: src\KnownMonikersExplorer2022\source.extension.vsixmanifest
      VsixManifestSourcePath: src\KnownMonikersExplorer2022\source.extension.cs

    steps:
    - uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.sln', '**/*.csproj', '**/packages.config', '**/packages.lock.json', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Increment VSIX version
      id: vsix_version
      uses: madskristensen/vsix-version-stamp@v2
      with:
        manifest-file: ${{ env.VsixManifestPath }}
        vsix-token-source-file: ${{ env.VsixManifestSourcePath }}

    - name: Restore NuGet packages
      run: msbuild ${{ env.Solution }} /v:m -restore /t:Restore

    - name: Build
      run: msbuild ${{ env.Solution }} /v:m /m /p:Configuration=${{ env.Configuration }} /p:DeployExtension=${{ env.DeployExtension }}

    - name: Run tests
      run: >
        dotnet test ${{ env.TestProject }}
        --configuration ${{ env.Configuration }}
        --no-build
        --no-restore
        --verbosity normal
        --settings tests\KnownMonikersExplorer.Tests\CodeCoverage.runsettings
        --results-directory "${{ env.TestResultsDirectory }}"
        --logger "trx;LogFileName=test-results.trx"
        --collect "Code Coverage;Format=Cobertura"

    - name: Report test results
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      with:
        name: Test Results
        path: TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Add coverage summary
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem "${{ env.TestResultsDirectory }}" -Filter "*.cobertura.xml" -Recurse |
          Select-Object -First 1
        if (-not $coverageFile) {
          throw "Cobertura coverage report was not produced."
        }

        [xml]$coverage = Get-Content $coverageFile.FullName
        $lineCoverage = [double]$coverage.coverage.'line-rate'
        $branchCoverage = [double]$coverage.coverage.'branch-rate'
        "Code coverage: **$($lineCoverage.ToString('P2'))**" >> $env:GITHUB_STEP_SUMMARY
        "Branch coverage: **$($branchCoverage.ToString('P2'))**" >> $env:GITHUB_STEP_SUMMARY

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: |
          TestResults/**/*.trx
          TestResults/**/*.cobertura.xml
        if-no-files-found: error
        retention-days: 14

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}.vsix
        path: src\KnownMonikersExplorer2022\bin\${{ env.Configuration }}\KnownMonikersExplorer2022.vsix

  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}.vsix

      - name: Find VSIX file
        id: find_vsix
        shell: pwsh
        run: |
          $vsixFiles = Get-ChildItem -Path . -Filter *.vsix -Recurse
          if ($vsixFiles.Count -eq 0) {
            Write-Error "No VSIX file found"
            exit 1
          }
          if ($vsixFiles.Count -gt 1) {
            Write-Error "Multiple VSIX files found: $($vsixFiles.FullName -join ', ')"
            exit 1
          }
          $vsixFile = $vsixFiles[0]
          "vsix-path=$($vsixFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found VSIX at: $($vsixFile.FullName)"

      - name: Upload to Open VSIX
        uses: madskristensen/publish-vsixgallery@v1
        with:
          vsix-file: ${{ steps.find_vsix.outputs.vsix-path }}

      - name: Publish extension to Marketplace
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: '${{ steps.find_vsix.outputs.vsix-path }}'
          publish-manifest-file: 'vs-publish.json'
          personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}

      - name: Tag and release
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        id: tag_release
        uses: softprops/action-gh-release@v3
        with:
          body: release ${{ needs.build.outputs.version }}
          generate_release_notes: true
          tag_name: ${{ needs.build.outputs.version }}
          files: ${{ steps.find_vsix.outputs.vsix-path }}
